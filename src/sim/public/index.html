<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>concierge simulator</title>
<style>
  :root { --pink:#c2185b; --ink:#1c1c1e; --line:#e6e2dd; --bg:#f7f5f2; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; background:#fff; }
  header h1 { font-size:15px; margin:0; }
  header .tag { font-size:11px; letter-spacing:.08em; color:var(--pink); font-weight:600; }
  header .chips { margin-left:auto; display:flex; gap:6px; font-size:11px; color:#666; }
  header .chips span { background:#f0ede9; border-radius:99px; padding:2px 9px; }
  main { flex:1; display:flex; min-height:0; }
  /* phone */
  #phone { width:420px; min-width:340px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:#fff; }
  #post { margin:12px; border:1px solid var(--line); border-radius:12px; padding:12px; }
  #post .handle { font-weight:600; font-size:13px; }
  #post .caption { margin:6px 0 10px; color:#444; }
  #post-replies { margin-top:8px; font-size:12.5px; color:#555; }
  #post-replies div { padding:3px 0 3px 14px; border-left:2px solid var(--pink); margin-top:4px; }
  #post-replies b { color:var(--pink); }
  .row { display:flex; gap:8px; }
  input[type=text] { flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button { border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; background:#eee9e4; }
  button.primary { background:var(--pink); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #thread { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .bubble { max-width:82%; padding:8px 12px; border-radius:16px; white-space:pre-wrap; word-break:break-word; }
  .bubble.brand { align-self:flex-end; background:var(--pink); color:#fff; border-bottom-right-radius:4px; }
  .bubble.typing { padding:10px 14px; }
  .bubble.typing span { display:inline-block; width:6px; height:6px; margin:0 1.5px; border-radius:50%; background:#fff; opacity:.4; animation:tick 1.2s infinite; }
  .bubble.typing span:nth-child(2) { animation-delay:.2s; }
  .bubble.typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes tick { 0%,60%,100% { opacity:.35; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .bubble.typing span { animation:none; opacity:.7; } }
  .bubble.customer { align-self:flex-start; background:#efeae5; border-bottom-left-radius:4px; }
  .bubble a { color:inherit; }
  .meta { font-size:10.5px; color:#999; align-self:center; margin:4px 0; }
  #composer { padding:12px; border-top:1px solid var(--line); }
  #demo-btns { display:flex; gap:8px; padding:0 12px 10px; }
  #demo-btns button { font-size:12px; }
  details { margin:0 12px 12px; font-size:12.5px; }
  details summary { cursor:pointer; color:#666; }
  details .grid { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin-top:8px; }
  details input[type=text] { padding:5px 8px; }
  /* trace */
  #tracewrap { flex:1; display:flex; flex-direction:column; min-width:0; background:#14141a; color:#cfd2dc; }
  #tracewrap h2 { font-size:11px; letter-spacing:.1em; margin:0; padding:10px 14px; color:#8a8fa3; border-bottom:1px solid #23232c; }
  #trace { flex:1; overflow-y:auto; padding:10px 14px; font:12px/1.6 ui-monospace,Consolas,monospace; }
  #trace div { white-space:pre-wrap; word-break:break-word; }
  .k-webhook{color:#7ec8ff} .k-tool{color:#ffd479} .k-send{color:#8ae68a} .k-opener{color:#ff9ad5}
  .k-error{color:#ff7b72} .k-rejected{color:#ff7b72;font-weight:700} .k-dedupe{color:#c8a3ff}
  .k-window{color:#c8a3ff} .k-discount{color:#8ae6d0} .k-skip,.k-info,.k-sim{color:#8a8fa3}
</style>
</head>
<body>
<header>
  <h1 id="brand">concierge simulator</h1>
  <span class="tag">SIMULATOR — local stand-in for instagram</span>
  <div class="chips"><span id="chip-transport"></span><span id="chip-llm"></span><span id="chip-mcp"></span></div>
</header>
<main>
  <section id="phone">
    <div id="post">
      <div class="handle" id="post-handle"></div>
      <div class="caption" id="post-caption"></div>
      <div class="row">
        <input type="text" id="comment-input" placeholder="comment on this post…">
        <button class="primary" id="comment-btn">comment</button>
      </div>
      <div id="post-replies"></div>
    </div>
    <div id="thread"><div class="meta">DMs will appear here</div></div>
    <div id="demo-btns">
      <button id="redeliver-btn" title="Meta redelivers webhooks — prove the duplicate is a no-op">↻ redeliver last webhook</button>
      <button id="tamper-btn" title="forge the HMAC — prove unverified payloads are rejected">✗ tamper signature</button>
    </div>
    <div id="composer" class="row">
      <input type="text" id="dm-input" placeholder="message as customer…">
      <button class="primary" id="dm-btn">send</button>
    </div>
    <details>
      <summary>persona &amp; post</summary>
      <div class="grid">
        <label>username</label><input type="text" id="p-username">
        <label>name</label><input type="text" id="p-name">
        <label>followers</label><input type="text" id="p-followers">
        <label>follows brand</label><input type="checkbox" id="p-follows">
        <label>post caption</label><input type="text" id="p-caption">
        <span></span><button id="p-save">save persona</button>
      </div>
    </details>
  </section>
  <section id="tracewrap">
    <h2>SYSTEM TRACE — webhooks · verification · agent tool calls · sends</h2>
    <div id="trace"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let persona = null;

const fmt = (t) => new Date(t).toLocaleTimeString([], {hour12:false});
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

function addTrace(ev) {
  const d = document.createElement('div');
  d.className = 'k-' + ev.kind;
  d.innerHTML = `<span style="opacity:.45">${fmt(ev.at)}</span> [${ev.kind}] ${esc(ev.text)}`;
  $('trace').appendChild(d);
  $('trace').scrollTop = $('trace').scrollHeight;
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement('div');
  typingEl.className = 'bubble brand typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  $('thread').appendChild(typingEl);
  $('thread').scrollTop = $('thread').scrollHeight;
}
function clearTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function addOutbound(msg) {
  clearTyping();
  if (msg.kind === 'comment_reply') {
    const d = document.createElement('div');
    d.innerHTML = `<b>↳ brand replied publicly:</b> ${esc(msg.text)}`;
    $('post-replies').appendChild(d);
    return;
  }
  addBubble('brand', msg.text, msg.kind === 'private_reply' ? 'private reply (the one-shot opener)' : null);
}

function addBubble(cls, text, label) {
  if (label) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = label; $('thread').appendChild(m); }
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  b.innerHTML = linkify(text);
  $('thread').appendChild(b);
  $('thread').scrollTop = $('thread').scrollHeight;
}

function applyPersona(p, post) {
  persona = p;
  $('post-handle').textContent = '@' + ($('brand').textContent || 'brand');
  $('post-caption').textContent = post.caption;
  $('p-username').value = p.username; $('p-name').value = p.name;
  $('p-followers').value = p.follower_count; $('p-follows').checked = !!p.is_user_follow_business;
  $('p-caption').value = post.caption;
}

const post = (url, body) => fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });

$('comment-btn').onclick = async () => {
  const text = $('comment-input').value.trim(); if (!text) return;
  $('comment-input').value = '';
  addBubble('customer', text, `@${persona.username} commented on the post`);
  await post('/sim/comment', { text });
};
$('dm-btn').onclick = async () => {
  const text = $('dm-input').value.trim(); if (!text) return;
  $('dm-input').value = '';
  addBubble('customer', text);
  await post('/sim/dm', { text });
};
$('dm-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dm-btn').click(); });
$('comment-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('comment-btn').click(); });
$('redeliver-btn').onclick = () => post('/sim/redeliver');
$('tamper-btn').onclick = () => post('/sim/tamper');
$('p-save').onclick = () => post('/sim/persona', {
  username: $('p-username').value, name: $('p-name').value,
  follower_count: +$('p-followers').value, is_user_follow_business: $('p-follows').checked,
  post_caption: $('p-caption').value,
});

const es = new EventSource('/sim/events');
es.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'init') {
    $('brand').textContent = msg.config.brandName;
    $('chip-transport').textContent = 'transport: ' + msg.config.transport;
    $('chip-llm').textContent = 'llm: ' + msg.config.llm;
    $('chip-mcp').textContent = 'mcp: ' + msg.config.mcpHost;
    applyPersona(msg.persona, msg.post);
    msg.traces.forEach(addTrace);
    msg.outbound.forEach(addOutbound);
  } else if (msg.type === 'trace') addTrace(msg.ev);
  else if (msg.type === 'outbound') addOutbound(msg.msg);
  else if (msg.type === 'typing') showTyping();
  else if (msg.type === 'persona') applyPersona(msg.persona, msg.post);
};
</script>
</body>
</html>
